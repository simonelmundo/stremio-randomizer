<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Randomizer</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #12151c; color: #e8eef7;
    }
    main { width: min(440px, 92vw); text-align: center; }
    p { color: #9db0cc; line-height: 1.45; }
    a.primary, button {
      width: 100%; border: 0; border-radius: 10px; padding: 14px; box-sizing: border-box;
      font-size: 1rem; font-weight: 650; cursor: pointer; text-decoration: none;
      display: block;
      background: #3ddc97; color: #062416;
    }
    a.primary[hidden] { display: none; }
    button.ghost {
      background: transparent; color: #e8eef7; border: 1px solid rgba(232,238,247,.18);
      font-weight: 600; margin-top: 10px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #msg { margin-top: 12px; min-height: 1.2em; color: #7dffa8; font-size: 0.9rem; }
    .seed { color: #e8ff47; }
    .hint { font-size: 0.82rem; color: #6f7f99; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Randomizer</h1>
    <p>Current mix: shuffle <strong class="seed">#<span id="seed">__SEED__</span></strong></p>
    <button id="btn" type="button">Shuffle again</button>
    <a class="primary" id="install" href="#" hidden>Install shuffle <span id="nextSeed"></span></a>
    <button class="ghost" id="copy" type="button" hidden>Copy manifest URL</button>
    <div id="msg"></div>
    <p class="hint">
      Each shuffle is a new addon URL, so Stremio cannot keep serving the old list.
      Installing a new one replaces the previous mix.
    </p>
  </main>
  <script>
    (function () {
      var base = "__BASE__".replace(/\/$/, "");
      var seedEl = document.getElementById("seed");
      var btn = document.getElementById("btn");
      var install = document.getElementById("install");
      var nextSeedEl = document.getElementById("nextSeed");
      var copy = document.getElementById("copy");
      var msg = document.getElementById("msg");
      var manifestUrl = "";

      btn.onclick = async function () {
        btn.disabled = true;
        msg.textContent = "Shuffling...";
        try {
          var r = await fetch(base + "/reroll", { method: "POST" });
          var j = await r.json();
          if (!j || !j.manifestUrl) throw new Error("no seed returned");
          manifestUrl = j.manifestUrl;
          nextSeedEl.textContent = "#" + j.seed;
          install.href = j.installUrl;
          install.hidden = false;
          copy.hidden = false;
          msg.textContent = "Shuffle #" + j.seed + " ready - install it below.";
        } catch (e) {
          msg.textContent = "Failed: " + e.message;
        } finally {
          btn.disabled = false;
        }
      };

      copy.onclick = async function () {
        try {
          await navigator.clipboard.writeText(manifestUrl);
          msg.textContent = "Copied: " + manifestUrl;
        } catch (e) {
          msg.textContent = manifestUrl;
        }
      };
    })();
  </script>
</body>
</html>
